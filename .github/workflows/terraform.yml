name: terraform

# Pull request: fmt -> validate/tflint -> plan (posted to the PR).
# Push to main: fmt -> validate/tflint -> plan -> [manual approval in the aws-dev environment] -> apply.

on:
  pull_request:
    paths:
      - "terraform/**"
      - "bootstrap/**"
      - "scripts/**"
      - ".terraform-version"
      - ".tflint.hcl"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "bootstrap/**"
      - "scripts/**"
      - ".terraform-version"
      - ".tflint.hcl"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

# PRs: a newer push makes the running plan obsolete. main: never cancel, an apply may be in flight;
# runs queue up instead, so two applies never race on the same state.
concurrency:
  group: terraform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
  TF_STATE_KEY: magnolia/dev/terraform.tfstate

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-terraform has no version-file input: read the pinned version ourselves.
      - name: Read pinned Terraform version
        id: tfver
        working-directory: .
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

  validate:
    name: validate (${{ matrix.stack }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        stack: [terraform, bootstrap]
    defaults:
      run:
        working-directory: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-terraform has no version-file input: read the pinned version ourselves.
      - name: Read pinned Terraform version
        id: tfver
        working-directory: .
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}

      # No backend and no credentials: a pure static check. The committed lock file must cover
      # every provider (-lockfile=readonly), so CI never silently picks up a different build.
      - name: terraform init
        run: terraform init -backend=false -lockfile=readonly

      - name: terraform validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - name: tflint
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact
        env:
          GITHUB_TOKEN: ${{ github.token }} # rate limit for downloading the ruleset

  plan:
    name: plan
    needs: [fmt, validate]
    runs-on: ubuntu-24.04
    # Forks get no OIDC token; without the role there is nothing to plan against.
    if: >-
      vars.AWS_PLAN_ROLE_ARN != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      id-token: write       # OIDC -> AWS, no long-lived keys in GitHub
      pull-requests: write  # plan comment
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
      fingerprint: ${{ steps.plan.outputs.fingerprint }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-terraform has no version-file input: read the pinned version ourselves.
      - name: Read pinned Terraform version
        id: tfver
        working-directory: .
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}

      - name: terraform init
        run: >-
          terraform init -lockfile=readonly
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=${{ env.TF_STATE_KEY }}"
          -backend-config="region=${{ env.AWS_REGION }}"

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -lock-timeout=5m -detailed-exitcode -out=tfplan > plan.log 2>&1
          rc=$?
          set -e
          cat plan.log
          if [ "$rc" -eq 1 ]; then exit 1; fi
          echo "has_changes=$([ "$rc" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          terraform show -no-color tfplan > plan.txt
          echo "fingerprint=$(../scripts/plan-fingerprint.sh tfplan)" >> "$GITHUB_OUTPUT"

      - name: Render plan summary
        if: always() && steps.plan.outcome != 'skipped'
        run: |
          file=plan.txt; [ -s plan.txt ] || file=plan.log
          summary=$(grep -E '^(Plan:|No changes\.)' "$file" | tail -1 || true)
          {
            echo "### Terraform plan — \`${{ steps.plan.outcome }}\`"
            echo
            echo "**${summary:-see details}**"
            echo
            echo "<details><summary>Show plan</summary>"
            echo
            echo '```'
            head -c 60000 "$file"   # GitHub comment limit is 65k characters
            echo '```'
            echo "</details>"
            echo
            echo "_Fingerprint \`${{ steps.plan.outputs.fingerprint }}\` · commit ${{ github.event.pull_request.head.sha || github.sha }} · run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_"
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request' && steps.plan.outcome != 'skipped'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: terraform-plan
          path: terraform/comment.md

  apply:
    name: apply
    needs: plan
    runs-on: ubuntu-24.04
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.plan.outputs.has_changes == 'true'
    # Required reviewers and "main only" are configured on the environment in GitHub; the AWS apply
    # role trusts only jobs running in it. The reviewer approves the plan shown in the plan job.
    environment: aws-dev
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-terraform has no version-file input: read the pinned version ourselves.
      - name: Read pinned Terraform version
        id: tfver
        working-directory: .
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-apply-${{ github.run_id }}

      - name: terraform init
        run: >-
          terraform init -lockfile=readonly
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=${{ env.TF_STATE_KEY }}"
          -backend-config="region=${{ env.AWS_REGION }}"

      # The plan file is not handed over as an artifact: it holds sensitive values in clear text,
      # and artifacts of a public repository can be downloaded by anyone. Instead, re-plan and
      # refuse to apply unless the changes are exactly the ones the reviewer approved.
      - name: terraform plan (must match the approved plan)
        env:
          APPROVED: ${{ needs.plan.outputs.fingerprint }}
        run: |
          terraform plan -no-color -lock-timeout=5m -out=tfplan
          current=$(../scripts/plan-fingerprint.sh tfplan)
          echo "approved: ${APPROVED}"
          echo "current:  ${current}"
          if [ "${current}" != "${APPROVED}" ]; then
            echo "::error::The plan changed after it was approved (state or AWS drifted). Re-run the workflow and review the new plan."
            exit 1
          fi

      - name: terraform apply
        run: terraform apply -no-color -lock-timeout=5m tfplan

      - name: Outputs
        run: |
          {
            echo "### Deployed"
            echo
            echo "- Magnolia: $(terraform output -raw magnolia_url)"
            echo "- Instance: \`$(terraform output -raw instance_id)\`"
          } >> "$GITHUB_STEP_SUMMARY"
